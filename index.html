<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>조회수 TOP 30 · 영화 드라마 여행 한류</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#EDF0F5;--surface:#fff;--ink:#16233B;--muted:#5E6B82;--line:#D3D9E4;--accent:#E0245E;--accent-ink:#fff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.55 "Noto Sans KR",system-ui,sans-serif}
.wrap{max-width:860px;margin:0 auto;padding:28px 16px 64px}
h1{font:400 clamp(30px,6vw,46px)/1.1 "Black Han Sans","Noto Sans KR",sans-serif;margin:0 0 6px;letter-spacing:-.01em}
.sub{margin:0 0 22px;color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;display:grid;gap:12px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);color:var(--ink);padding:8px 14px;font:inherit;cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed=true]{background:var(--ink);color:#fff}
.search{display:flex;flex:1 1 260px;gap:8px}
input[type=search],select{font:inherit;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px 12px;background:#fff}
input[type=search]{flex:1;min-width:0}
.go{border:0;border-radius:8px;background:var(--accent);color:var(--accent-ink);font:inherit;font-weight:700;padding:8px 18px;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid #2F6FED;outline-offset:2px}
.status{margin:18px 2px 8px;color:var(--muted);font-size:14px;min-height:1.4em}
.status.err{color:#B3123F;font-weight:500}
ol{list-style:none;margin:0;padding:0;display:grid;gap:10px}
li{display:grid;grid-template-columns:48px 160px 1fr;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px 10px 10px}
.rk{font:400 34px/1 "Black Han Sans",sans-serif;text-align:center;color:var(--muted)}
li:nth-child(-n+3) .rk{color:var(--accent)}
.th{position:relative;display:block;aspect-ratio:16/9;border-radius:6px;overflow:hidden;background:#cfd6e2}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.dur{position:absolute;right:4px;bottom:4px;background:rgba(0,0,0,.78);color:#fff;font-size:12px;padding:0 5px;border-radius:3px}
.ti{display:block;color:var(--ink);font-weight:700;text-decoration:none;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ti:hover{text-decoration:underline}
.meta{margin-top:4px;font-size:13px;color:var(--muted)}
.meta b{color:var(--ink);font-weight:700}
.tag{display:inline-block;margin-left:6px;padding:0 7px;border-radius:99px;font-size:12px;border:1px solid var(--line);color:var(--ink);vertical-align:1px}
.tag.s{background:var(--accent);border-color:var(--accent);color:#fff}
@media(max-width:600px){li{grid-template-columns:34px 1fr;grid-template-areas:"r t" "r i"}.rk{grid-area:r;font-size:26px}.th{grid-area:t}.info{grid-area:i}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<main class="wrap">
  <h1>조회수 TOP 30</h1>
  <p class="sub">카테고리를 고르고 키워드로 좁혀서, 조회수 높은 영상 30개를 확인하세요.</p>

  <form class="panel" id="f">
    <div class="row">
      <div class="seg" id="cats" role="group" aria-label="카테고리"></div>
      <div class="seg" id="fmts" role="group" aria-label="영상 길이">
        <button type="button" data-v="all" aria-pressed="true">전체</button>
        <button type="button" data-v="long" aria-pressed="false">롱폼</button>
        <button type="button" data-v="short" aria-pressed="false">쇼츠</button>
      </div>
      <select id="period" aria-label="기간">
        <option value="all">전체 기간</option>
        <option value="week">최근 7일</option>
        <option value="month">최근 30일</option>
        <option value="year">최근 1년</option>
      </select>
    </div>
    <div class="row">
      <div class="search">
        <input type="search" id="q" placeholder="키워드 (비워두면 카테고리 전체)" maxlength="80" aria-label="키워드 검색">
        <button class="go" type="submit">조회</button>
      </div>
    </div>
  </form>

  <div class="status" id="status" role="status" aria-live="polite"></div>
  <ol id="list"></ol>
</main>

<script>
const $ = s => document.querySelector(s);
const state = { category: "movie", format: "all" };
const nf = new Intl.NumberFormat("ko-KR", { notation: "compact", maximumFractionDigits: 1 });
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const fmtDur = sec => { const h = Math.floor(sec/3600), m = Math.floor(sec%3600/60), s = sec%60;
  return (h ? h + ":" + String(m).padStart(2,"0") : m) + ":" + String(s).padStart(2,"0"); };

function bindSeg(box, key) {
  box.addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    box.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === b));
    state[key] = b.dataset.v; load();
  });
}

async function init() {
  const cats = await (await fetch("/api/categories")).json();
  $("#cats").innerHTML = cats.map((c, i) =>
    `<button type="button" data-v="${c.key}" aria-pressed="${i === 0}">${esc(c.label)}</button>`).join("");
  state.category = cats[0].key;
  bindSeg($("#cats"), "category"); bindSeg($("#fmts"), "format");
  $("#period").addEventListener("change", load);
  $("#f").addEventListener("submit", e => { e.preventDefault(); load(); });
  load();
}

async function load() {
  const st = $("#status"), list = $("#list");
  st.className = "status"; st.textContent = "불러오는 중…"; list.innerHTML = "";
  const p = new URLSearchParams({ category: state.category, format: state.format, period: $("#period").value, q: $("#q").value.trim() });
  try {
    const r = await fetch("/api/rank?" + p);
    const d = await r.json();
    if (!r.ok) throw new Error(d.detail || "조회에 실패했습니다.");
    if (!d.items.length) { st.textContent = "조건에 맞는 영상이 없습니다. 키워드나 기간을 바꿔 보세요."; return; }
    st.textContent = `${d.count}개 영상 · 검색어: ${d.query}${d.cached ? " · 캐시된 결과" : ""}`;
    list.innerHTML = d.items.map(v => `
      <li>
        <div class="rk">${v.rank}</div>
        <a class="th" href="${esc(v.url)}" target="_blank" rel="noopener" tabindex="-1" aria-hidden="true">
          <img src="${esc(v.thumb)}" alt="" loading="lazy"><span class="dur">${fmtDur(v.duration)}</span>
        </a>
        <div class="info">
          <a class="ti" href="${esc(v.url)}" target="_blank" rel="noopener">${esc(v.title)}</a>
          <div class="meta">${esc(v.channel)} · 조회수 <b title="${v.views.toLocaleString("ko-KR")}회">${nf.format(v.views)}</b>${v.likes != null ? " · 좋아요 " + nf.format(v.likes) : ""} · ${esc(v.published)}
            <span class="tag ${v.is_short ? "s" : ""}">${v.is_short ? "쇼츠" : "롱폼"}</span></div>
        </div>
      </li>`).join("");
  } catch (e) { st.className = "status err"; st.textContent = e.message; }
}
init();
</script>
</body>
</html>
